[project]
name = "iris-sagemaker-training"
version = "0.1.0"
description = "Reproducible MiniCPM5 Iris tool-use training scaffold"
requires-python = "==3.12.10"
dependencies = [
  "accelerate==1.14.0",
  "boto3==1.43.48",
  "datasets==5.0.0",
  "huggingface-hub==0.36.0",
  "jsonschema==4.26.0",
  "peft==0.19.1",
  "PyYAML==6.0.3",
  "safetensors==0.8.0",
  "tokenizers==0.22.2",
  "torch==2.7.1",
  "transformers==4.57.3",
]

[project.scripts]
binary-llm-small = "binary_llm.orchestration.small_scale_protocols:main"

[project.optional-dependencies]
dev = ["hypothesis==6.156.2"]
qlora = ["bitsandbytes==0.49.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = [".*", "build", "dist", "CVS", "_darcs", "{arch}", "*.egg", "venv", "tmp", ".hypothesis"]
addopts = "-q --hypothesis-profile=ci --hypothesis-seed=0"
